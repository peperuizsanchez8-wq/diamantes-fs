  #fbApp { font-family: 'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif; background:#F4F7F2; color:#12261C; min-height:100%; }

  .fb-zone-val.verde { background:#EAFBEF; color:#1B5E27; }

  function generateTeams(confirmed, formatId, incompatibilities) {
    incompatibilities = incompatibilities || [];
    const size = formatId && formatId.charAt(0) === "8" ? 8 : 7;
    const medQuota = size === 8 ? 3 : 2;
    const quota = { "Defensa central": 1, "Defensa lateral": 2, Centrocampista: medQuota, Delantero: 1 };
    const posOrder = Object.keys(quota);

    let pool = confirmed.slice();
    const need = { A: Object.assign({}, quota), B: Object.assign({}, quota) };
    const posSum = { A: {}, B: {} };
    posOrder.forEach((pos) => { posSum.A[pos] = 0; posSum.B[pos] = 0; });
    let teamA = [], teamB = [], sumA = 0, sumB = 0;

    function assign(team, player, pos) {
      const withRole = Object.assign({}, player, { assignedRole: pos || "cambio" });
      if (team === "A") { teamA.push(withRole); sumA += player.level; } else { teamB.push(withRole); sumB += player.level; }
      if (pos) { need[team][pos]--; posSum[team][pos] += player.level; }
      pool = pool.filter((p) => p.id !== player.id);
    }
    function eligiblePositions(p) {
      return posOrder.filter((pos) => (p.positions || []).includes(pos) && (need.A[pos] > 0 || need.B[pos] > 0));
    }

    let guard = 0;
    while (guard++ < 500) {
      const candidates = pool.map((p) => ({ p, elig: eligiblePositions(p) })).filter((x) => x.elig.length > 0);
      if (candidates.length === 0) break;
      candidates.sort((a, b) => a.elig.length - b.elig.length || b.p.level - a.p.level);
      const { p, elig } = candidates[0];
      const pos = elig.slice().sort((a, b) => (need.A[a] + need.B[a]) - (need.A[b] + need.B[b]))[0];
      const aNeeds = need.A[pos] > 0, bNeeds = need.B[pos] > 0;
      let team;
      if (aNeeds && bNeeds) team = posSum.A[pos] <= posSum.B[pos] ? "A" : "B";
      else team = aNeeds ? "A" : "B";
      assign(team, p, pos);
    }

    pool.sort((a, b) => b.level - a.level);
    pool.forEach((p) => {
      let team;
      if (teamA.length < teamB.length) team = "A";
      else if (teamB.length < teamA.length) team = "B";
      else team = sumA <= sumB ? "A" : "B";
      assign(team, p, null);
    });

    while (Math.abs(teamA.length - teamB.length) > 1) {
      const bigIsA = teamA.length > teamB.length;
      const big = bigIsA ? teamA : teamB;
      const small = bigIsA ? teamB : teamA;
      let bestIdx = 0, bestDiff = Infinity;
      big.forEach((p, idx) => {
        const bigSumAfter = (bigIsA ? sumA : sumB) - p.level;
        const smallSumAfter = (bigIsA ? sumB : sumA) + p.level;
        const d = Math.abs(bigSumAfter - smallSumAfter);
        if (d < bestDiff) { bestDiff = d; bestIdx = idx; }
      });
      const moved = big.splice(bestIdx, 1)[0];
      moved.assignedRole = "cambio";
      small.push(moved);
      if (bigIsA) { sumA -= moved.level; sumB += moved.level; }
      else { sumB -= moved.level; sumA += moved.level; }
    }

    // Ajuste fino: intercambia jugadores del mismo puesto entre equipos, pero
    // el criterio para aceptar el cambio es que mejore el equilibrio de ESA
    // zona en concreto (no el total general) — así nunca se descompensa una
    // zona para arreglar otra.
    let optIter = 0, optImproved = true;
    while (optImproved && optIter < 200) {
      optImproved = false; optIter++;
      outerOpt: for (let ia = 0; ia < teamA.length; ia++) {
        for (let ib = 0; ib < teamB.length; ib++) {
          const pa = teamA[ia], pb = teamB[ib];
          if (pa.assignedRole !== pb.assignedRole) continue;
          const role = pa.assignedRole;
          const zoneA = teamA.filter((p) => p.assignedRole === role).reduce((s, p) => s + p.level, 0);
          const zoneB = teamB.filter((p) => p.assignedRole === role).reduce((s, p) => s + p.level, 0);
          const curZoneDiff = Math.abs(zoneA - zoneB);
          const newZoneA = zoneA - pa.level + pb.level;
          const newZoneB = zoneB - pb.level + pa.level;
          if (Math.abs(newZoneA - newZoneB) < curZoneDiff) {
            teamA[ia] = pb; teamB[ib] = pa;
            sumA = sumA - pa.level + pb.level;
            sumB = sumB - pb.level + pa.level;
            optImproved = true;
            break outerOpt;
          }
        }
      }
    }

    teamA.sort((a, b) => b.level - a.level);
    teamB.sort((a, b) => b.level - a.level);

    function isIncompatible(idA, idB) {
      return incompatibilities.some((pr) => (pr[0] === idA && pr[1] === idB) || (pr[0] === idB && pr[1] === idA));
    }
    function findViolations(team) {
      const v = [];
      for (let i = 0; i < team.length; i++) for (let j = i + 1; j < team.length; j++) {
        if (isIncompatible(team[i].id, team[j].id)) v.push([i, j]);
      }
      return v;
    }
    function tryResolve(team, other) {
      const viol = findViolations(team);
      if (!viol.length) return false;
      const [i, j] = viol[0];
      for (const idx of [j, i]) {
        const moving = team[idx];
        for (let k = 0; k < other.length; k++) {
          const candidate = other[k];
          if (candidate.assignedRole !== moving.assignedRole) continue;
          const teamAfter = team.slice(); teamAfter[idx] = candidate;
          const otherAfter = other.slice(); otherAfter[k] = moving;
          if (findViolations(teamAfter).length === 0 && findViolations(otherAfter).length === 0) {
            team[idx] = candidate;
            other[k] = moving;
            return true;
          }
        }
      }
      return false;
    }
    let confGuard = 0;
    while (confGuard++ < 200) {
      if (tryResolve(teamA, teamB)) continue;
      if (tryResolve(teamB, teamA)) continue;
      break;
    }
    sumA = teamA.reduce((s, p) => s + p.level, 0);
    sumB = teamB.reduce((s, p) => s + p.level, 0);
    const warnings = findViolations(teamA).map(([i, j]) => teamA[i].name + " y " + teamA[j].name + " (Equipo Rosa)")
      .concat(findViolations(teamB).map(([i, j]) => teamB[i].name + " y " + teamB[j].name + " (Equipo Verde)"));

    teamA.sort((a, b) => b.level - a.level);
    teamB.sort((a, b) => b.level - a.level);
    return { teamA, teamB, sumA, sumB, warnings };
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  function computeLeagueStats() {
    const stats = {};
    state.players.forEach((p) => { stats[p.id] = { name: p.name, wins: 0, draws: 0, losses: 0 }; });
    pastMatches().forEach((m) => {
      if (!m.winner || !m.teams) return;
      ["A", "B"].forEach((key) => {
        (m.teams[key] || []).forEach((tp) => {
          if (!stats[tp.id]) return;
          const sig = m.signups.find((s) => s.playerId === tp.id);
          if (sig && sig.noShow) return;
          if (m.winner === "draw") stats[tp.id].draws++;
          else if (m.winner === key) stats[tp.id].wins++;
          else stats[tp.id].losses++;
        });
      });
    });
    return Object.values(stats)
      .filter((s) => s.wins + s.draws + s.losses > 0)
      .sort((a, b) => b.wins - a.wins || (b.wins - b.losses) - (a.wins - a.losses));
  }
  function computeStreak(playerId) {
    const played = pastMatches().filter((m) => m.winner && m.teams).filter((m) => {
      const s = m.signups.find((x) => x.playerId === playerId);
      return s && !s.waitlist && !s.noShow;
    });
    let streak = 0;
    for (const m of played) {
      let myKey = null;
      if ((m.teams.A || []).some((p) => p.id === playerId)) myKey = "A";
      else if ((m.teams.B || []).some((p) => p.id === playerId)) myKey = "B";
      if (!myKey) continue;
      if (m.winner === myKey) streak++;
      else break;
    }
    return streak;
  }
  function computeMatchMvp(m) {
    const votes = m.mvp_votes || {};
    const counts = {};
    Object.values(votes).forEach((votedFor) => { counts[votedFor] = (counts[votedFor] || 0) + 1; });
    const entries = Object.entries(counts);
    if (entries.length === 0) return { leaders: [], count: 0 };
    const maxCount = Math.max(...entries.map((e) => e[1]));
    return { leaders: entries.filter((e) => e[1] === maxCount).map((e) => e[0]), count: maxCount };
  }
  function computeSeasonMvpCounts() {
    const counts = {};
    pastMatches().forEach((m) => {
      const { leaders, count } = computeMatchMvp(m);
      if (leaders.length === 1 && count > 0) counts[leaders[0]] = (counts[leaders[0]] || 0) + 1;
    });

    if (state.editingId) {
      state.players = state.players.map((p) => (p.id === state.editingId ? Object.assign({}, p, { name, positions, level, is_organizer }) : p));
      state.editingId = null;
    } else {
      state.players.push({ id: uid(), name, positions, level, is_organizer });

  function editPlayer(id) {

  function deletePlayer(id) {
    state.players = state.players.filter((p) => p.id !== id);
    render();
    sbFetch("/players?id=eq." + encodeURIComponent(id), { method: "DELETE" }).catch(() => { state.err = "No se pudo borrar el jugador."; render(); });

  function addIncompatibility() {
    const rawA = document.getElementById("fbIncA").value;
    const rawB = document.getElementById("fbIncB").value;
    const errEl = document.getElementById("fbIncErr");
    if (!rawA || !rawB) { errEl.textContent = "Elige dos jugadores."; return; }
    if (rawA === rawB) { errEl.textContent = "Tienen que ser dos jugadores distintos."; return; }
    const a = rawA < rawB ? rawA : rawB;
    const b = rawA < rawB ? rawB : rawA;
    const exists = state.incompatibilities.some((pr) => pr[0] === a && pr[1] === b);
    if (exists) { errEl.textContent = "Esa pareja ya está en la lista."; return; }
    errEl.textContent = "";
    state.incompatibilities.push([a, b]);
    persistIncompatibilities();
    render();
  }
  function removeIncompatibility(idx) {
    const pair = state.incompatibilities[idx];
    state.incompatibilities.splice(idx, 1);
    render();
    sbFetch("/incompatibilities?player_a=eq." + encodeURIComponent(pair[0]) + "&player_b=eq." + encodeURIComponent(pair[1]), { method: "DELETE" })
      .catch(() => { state.err = "No se pudo quitar la pareja."; render(); });
  }

  function stepCap(delta) {
    const disp = document.getElementById("fbCapDisplay");
    const hidden = document.getElementById("fbNewCap");
    if (!disp || !hidden) return;
    let val = parseInt(hidden.value || "12", 10) + delta;
    if (val < 2) val = 2;
    hidden.value = val;
    disp.textContent = val;
  }
  function createMatch() {
    if (openMatch()) return;
    const date = document.getElementById("fbNewDate").value || nextSaturdayISO();
    const cap = Number(document.getElementById("fbNewCap").value) || 12;
    state.matches.push({ id: uid(), date, format: null, cap, status: "abierto", signups: [], teams: null });
    persistMatches();
    showToast("Partido abierto");
  }
  function closeMatch() {
    const m = openMatch(); if (!m) return;
    const winSel = document.getElementById("fbCloseWinner");
    const winner = winSel && winSel.value ? winSel.value : null;
    state.matches = state.matches.map((mm) => (mm.id === m.id ? Object.assign({}, mm, { status: "cerrado", winner }) : mm));
    persistMatches();
    showToast("Partido cerrado");
  }

    state.matches = state.matches.map((m) => (m.id === matchId ? Object.assign({}, m, { winner: winner || null }) : m));
    persistMatches();
    render();
  }
  function cancelMatch() {
    const m = openMatch(); if (!m) return;
    state.matches = state.matches.map((mm) => (mm.id === m.id ? Object.assign({}, mm, { status: "cancelado" }) : mm));
    persistMatches();
    render();
  }
  function joinMatchAs(playerId) {
    const m = openMatch(); if (!m || !playerId) return;
    if (m.signups.some((s) => s.playerId === playerId)) return;
    m.declines = (m.declines || []).filter((id) => id !== playerId);
    m.signups.push({ playerId, waitlist: false, noShow: false, ts: Date.now() });
    persistMatches();
    render();
  }
  function declineMatch() {
    const m = openMatch(); if (!m || !state.myPlayerId) return;
    m.signups = m.signups.filter((s) => s.playerId !== state.myPlayerId);
    m.declines = Array.from(new Set([...(m.declines || []), state.myPlayerId]));
    persistMatches();
    render();
  }
  function addGuestAndSignup() {
    const name = document.getElementById("fbGuestName").value.trim();
    const level = Number(document.getElementById("fbGuestLevel").value);
    const errEl = document.getElementById("fbGuestErr");
    if (!name) { errEl.textContent = "Escribe un nombre."; return; }
    errEl.textContent = "";
    const id = "guest:" + uid();
    state.guests.push({ id, name, positions: [], level });
    persistGuests();
    joinMatchAs(id);
  }
  function signupExistingGuest() {
    const sel = document.getElementById("fbGuestExisting");
    if (!sel || !sel.value) return;
    joinMatchAs(sel.value);
  }
  function leaveMatch(playerId) {
    const m = openMatch(); if (!m) return;
    let signups = m.signups.filter((s) => s.playerId !== playerId);
    const confirmed = signups.filter((s) => !s.waitlist).sort((a, b) => a.ts - b.ts);
    const waiting = signups.filter((s) => s.waitlist).sort((a, b) => a.ts - b.ts);
    while (confirmed.length < m.cap && waiting.length) { const n = waiting.shift(); n.waitlist = false; confirmed.push(n); }
    m.signups = confirmed.concat(waiting);
    persistMatches();
    render();
  }
  function toggleNoShow(matchId, playerId) {
    state.matches = state.matches.map((m) =>
      m.id === matchId
        ? { ...m, signups: m.signups.map((s) => (s.playerId === playerId ? { ...s, noShow: !s.noShow } : s)) }
        : m
    );
    persistMatches();
    render();
  }
  function genTeams(matchId) {
    const m = state.matches.find((x) => x.id === matchId); if (!m) return;
    const formatSel = document.getElementById("fbTeamFormat");
    if (formatSel) m.format = formatSel.value;
    const confirmed = m.signups.filter((s) => !s.waitlist).map((s) => playerObj(s.playerId)).filter(Boolean);
    const { teamA, teamB, sumA, sumB, warnings } = generateTeams(confirmed, m.format, state.incompatibilities);
    m.teams = { A: teamA, B: teamB, sumA, sumB, warnings };
    persistMatches();
    showToast("Equipos generados");
  }
  function viewEquiposHistory(matchId) {

  function manualSwap() {
    const selA = document.getElementById("fbSwapA");
    const selB = document.getElementById("fbSwapB");
    if (!selA || !selB || !selA.value || !selB.value) return;
    const matchId = selA.getAttribute("data-match");
    const m = state.matches.find((x) => x.id === matchId);
    if (!m || !m.teams) return;
    const iA = m.teams.A.findIndex((p) => p.id === selA.value);
    const iB = m.teams.B.findIndex((p) => p.id === selB.value);
    if (iA === -1 || iB === -1) return;
    const playerA = m.teams.A[iA];
    const playerB = m.teams.B[iB];
    m.teams.A[iA] = playerB;
    m.teams.B[iB] = playerA;
    m.teams.sumA = m.teams.sumA - playerA.level + playerB.level;
    m.teams.sumB = m.teams.sumB - playerB.level + playerA.level;
    persistMatches();
    showToast("Cambio hecho");
  }

          <p class="fb-h2" style="margin-bottom:4px">${esc(title)}</p>
          <p class="fb-small" style="margin-bottom:12px">${esc(pmPlayer ? pmPlayer.name : "")}${pm.mode === "create" ? " · Este PIN es solo tuyo, para identificarte la próxima vez." : ""}</p>
          ${pm.mode !== "checking" ? `<input class="fb-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="fbPinInput" placeholder="••••" onkeydown="if(event.key==='Enter')FB.submitPinModal()">` : `<p class="fb-small">Comprobando...</p>`}
          ${pm.error ? `<p class="fb-small" style="color:#C1443C;margin-top:8px">${esc(pm.error)}</p>` : ""}
          <div style="display:flex;gap:8px;margin-top:12px">
            ${pm.mode !== "checking" ? `<button class="fb-btn fb-btn-gold" onclick="FB.submitPinModal()">Entrar</button>` : ""}
            <button class="fb-btn fb-btn-outline" onclick="FB.cancelPinModal()">Cancelar</button>
          </div>
        </div>
      </div>`;
    }

    if (state.toast) {
      html += `<div class="fb-toast">${icon("check", 14)} ${esc(state.toast)}</div>`;
    }

    if (state.confirmModal) {
      const cm = state.confirmModal;
      html += `<div class="fb-modal-overlay">
        <div class="fb-modal">
          <p class="fb-h2" style="margin-bottom:10px">¿Seguro?</p>
          <p class="fb-small" style="margin-bottom:14px">${esc(cm.message)}</p>
          <div style="display:flex;gap:8px">
            <button class="fb-btn" style="background:#C1443C;color:#fff" onclick="FB.confirmYes()">Sí, adelante</button>
            <button class="fb-btn fb-btn-outline" onclick="FB.cancelConfirm()">Cancelar</button>
          </div>
        </div>
      </div>`;
    }

    root.innerHTML = html;
    if (state.showPasswordModal) {
      const pwInput = document.getElementById("fbAdminPw");
      if (pwInput) pwInput.focus();
    }
    if (state.pinModal && state.pinModal.mode !== "checking") {
      const pinInput = document.getElementById("fbPinInput");
      if (pinInput) pinInput.focus();
    }
  }

  window.FB = {
    setTab, toggleAdmin, addOrSavePlayer, editPlayer, cancelEdit, deletePlayer,
    createMatch, closeMatch, cancelMatch, setMatchWinner, joinMatchAs, leaveMatch, declineMatch, toggleNoShow, genTeams, stepCap,
    addIncompatibility, removeIncompatibility, checkAdminPassword, cancelPasswordModal,
    selectMyPlayer, forgetMyPlayer, addGuestAndSignup, signupExistingGuest, deleteGuest,
    tapFicha, cancelPinModal, submitPinModal, toggleEditMyFicha, saveMyFicha, adminResetPin, enablePush,
    viewEquiposHistory, manualSwap, askConfirm, cancelConfirm, confirmYes, confirmDeletePlayer, confirmDeleteGuest, voteMvp, exportBackup, forceReload, toggleZoneComparator, toggleManualSwap,
  };

  loadAll();
})();
</script>
</body>
</html>
